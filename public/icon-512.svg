<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1535"/>
      <stop offset="100%" stop-color="#06050b"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#05d5ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#9a86ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06050b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer ring glow -->
  <circle cx="256" cy="230" r="150" fill="none" stroke="#9a86ff" stroke-width="1" opacity="0.2"/>
  <!-- Orb glow -->
  <circle cx="256" cy="230" r="130" fill="url(#orb)"/>
  <!-- Wireframe sphere -->
  <g stroke="#05d5ff" stroke-width="2.5" fill="none" opacity="0.85" filter="url(#glow)">
    <circle cx="256" cy="230" r="120"/>
    <ellipse cx="256" cy="230" rx="120" ry="46"/>
    <ellipse cx="256" cy="230" rx="120" ry="82"/>
    <line x1="256" y1="110" x2="256" y2="350"/>
    <line x1="136" y1="230" x2="376" y2="230"/>
  </g>
  <!-- Inner cross lines -->
  <g stroke="#9a86ff" stroke-width="1.2" fill="none" opacity="0.5">
    <ellipse cx="256" cy="230" rx="60" ry="20"/>
    <line x1="196" y1="150" x2="316" y2="310"/>
    <line x1="316" y1="150" x2="196" y2="310"/>
  </g>
  <!-- Floating particles -->
  <g fill="#05d5ff" filter="url(#glow2)">
    <rect x="90" y="170" width="8" height="8" rx="1" opacity="0.8" transform="rotate(30 94 174)"/>
    <rect x="410" y="200" width="6" height="6" rx="1" opacity="0.6" transform="rotate(-20 413 203)"/>
    <rect x="130" y="310" width="5" height="5" rx="1" opacity="0.5" transform="rotate(45 132 312)"/>
    <rect x="380" y="280" width="7" height="7" rx="1" opacity="0.7" transform="rotate(10 383 283)"/>
  </g>
  <!-- SONIC//SPACE text -->
  <text x="256" y="430" font-family="Arial Black, sans-serif" font-weight="900" font-size="48" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#glow2)">SONIC</text>
  <text x="256" y="478" font-family="Arial Black, sans-serif" font-weight="900" font-size="30" fill="#05d5ff" text-anchor="middle" letter-spacing="4">//SPACE</text>
</svg>

